name: Backend PR checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/pr-backend.yml'

jobs:
  test-backend:
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: postgresql+asyncpg://echokey:echokey@localhost:5432/echokey_test

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: echokey
          POSTGRES_PASSWORD: echokey
          POSTGRES_DB: echokey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echokey -d echokey_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      
      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff lint
        run: ruff check .

      - name: Run backend tests
        run: pytest