apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "echokey.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "echokey.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: api
      port: 8000
      targetPort: http
      protocol: TCP
