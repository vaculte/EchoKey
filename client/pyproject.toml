[project]
name = "echokey-client"
version = "0.1.0"
description = "EchoKey Linux desktop client"
requires-python = ">=3.11"
dependencies = [
    "pynput",
    "evdev",
    "sounddevice",
    "numpy",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pystray",
    "Pillow",
    "pyperclip",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
echokey = "echokey.main:main"

[tool.setuptools]
packages = ["echokey"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]