apiVersion: v1
kind: ConfigMap
metadata:
  name: echokey-config
  namespace: echokey-dev
  labels:
    app.kubernetes.io/name: echokey
    app.kubernetes.io/instance: echokey-dev
    app.kubernetes.io/component: configuration
    app.kubernetes.io/managed-by: kubectl
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  AUDIO_UPLOAD_DIR: /app/uploads
  VOSK_MODEL_PATH: /app/models/vosk
  LOG_LEVEL: INFO
