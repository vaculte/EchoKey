apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: echokey-dev
  labels:
    app.kubernetes.io/name: echokey
    app.kubernetes.io/instance: echokey-dev
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echokey
      app.kubernetes.io/instance: echokey-dev
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echokey
        app.kubernetes.io/instance: echokey-dev
        app.kubernetes.io/component: api
    spec:
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
      nodeSelector:
        kubernetes.io/hostname: k8s-echokey-worker
      containers:
        - name: api
          image: ghcr.io/vaculte/echokey:df1ff3ce2467cab6f6740b7cb704fa59de30d6fc
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
          args:
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: echokey-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: echokey-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: echokey-secrets
                  key: REDIS_URL
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
