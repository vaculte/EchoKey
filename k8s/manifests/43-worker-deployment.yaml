apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: echokey-dev
  labels:
    app.kubernetes.io/name: echokey
    app.kubernetes.io/instance: echokey-dev
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: echokey
      app.kubernetes.io/instance: echokey-dev
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echokey
        app.kubernetes.io/instance: echokey-dev
        app.kubernetes.io/component: worker
    spec:
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: vosk-model
          persistentVolumeClaim:
            claimName: vosk-model
      nodeSelector:
        kubernetes.io/hostname: k8s-echokey-worker2
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: download-vosk-model
          image: ghcr.io/vaculte/echokey:5739ae9e99c71074499de3322359b5de1db7d4d8
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - app.scripts.install_vosk_model
          args:
            - --volume
            - /model
            - --download-url
            - https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
            - --extracted-directory
            - vosk-model-small-ru-0.22
          volumeMounts:
            - name: vosk-model
              mountPath: /model
      containers:
        - name: worker
          image: ghcr.io/vaculte/echokey:5739ae9e99c71074499de3322359b5de1db7d4d8
          imagePullPolicy: IfNotPresent
          command:
            - celery
          args:
            - -A
            - app.celery_app
            - worker
            - --loglevel=info
            - --concurrency=1
          envFrom:
            - configMapRef:
                name: echokey-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: echokey-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: echokey-secrets
                  key: REDIS_URL
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: vosk-model
              mountPath: /app/models
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
